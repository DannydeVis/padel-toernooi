  <line x1="224" y1="368" x2="272" y2="368" stroke="#9ca3af" stroke-width="4"/>
  <line x1="224" y1="384" x2="272" y2="384" stroke="#9ca3af" stroke-width="4"/>
  <line x1="224" y1="400" x2="272" y2="400" stroke="#9ca3af" stroke-width="4"/>
  <!-- Ball -->
  <circle cx="372" cy="118" r="56" fill="#fbbf24"/>
  <path d="M 348 88 Q 380 108 375 155" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 396 88 Q 364 108 369 155" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>
</svg>
